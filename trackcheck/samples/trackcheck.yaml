# 由 埋点小岛 保存（原注释不保留，上一个版本备份在同名 .bak）
options: {null_equals_empty: true, strict_fields: false, datasource_dir: datasources}
log:
  pattern: Event:\s*id:\s*(?P<id>\d+)\s*data:\s*(?P<data>.*?)\s*$
  logcat_args: []
device:
  package: com.example.app
  dbs: [app.db]
sources:
  mine_api_cache: {type: sqlite_json, db: app, sql: SELECT content FROM api_cache WHERE cache_key = 'mine_page' ORDER BY updated_at DESC LIMIT 1}
dicts:
  card_type:
    desc: 我的页卡片类型映射
    events: [88860004086007, 88860004086008]
    items: {large_normal: 1, small_normal: 2, double_column: 3}
  card_type_name:
    events: [88860004086007, 88860004086008]
    items: {1: 大单卡, 2: 小单卡, 3: 双列卡}
templates:
  mine_card:
    context:
      res:
        from: mine_page
        path: data.myPage[*].res[*]
        where: {id: '{resID}'}
      card:
        from: res
        path: body.cards[*]
        where: {cardId: '{operationCardId}'}
      item: {from: card, path: 'items[0]'}
    fields:
      resID: {from: res.id, desc: 资源位ID}
      onPlanID: {from: res.planId, desc: 投放计划ID}
      resName: {from: res.planName, desc: 投放计划名称}
      operationCardId: {from: card.cardId, desc: 运营卡片ID}
      cardType: {from: card.cardType, map: card_type, desc: 卡片类型}
      cardName:
        from: card.cardType
        map: [card_type, card_type_name]
        desc: 卡片名称
      dismissLogic: {from: item.disappearType, desc: 消失逻辑}
      contentPoolId: {from: item.contentPool.contentPoolId, desc: 内容池ID}
      channelId: {from: item.link.channelId, desc: 渠道ID}
      subChannelId: {from: item.link.subChannelId, desc: 子渠道ID}
events:
  88860004086007:
    name: 我的页-卡片曝光
    extends: mine_card
    dedupe: [resID, operationCardId]
    dedupe_window: 2
  88860004086008:
    name: 我的页-卡片点击
    extends: mine_card
    context:
      res:
        from: mine_api_cache
        path: data.myPage[*].res[*]
        where: {id: '{resID}'}
    fields:
      rank:
        type: int
        range: [1, 20]
        desc: 卡片位置（从1开始）
      type:
        enum: {open: 打开, close: 关闭}
        desc: 点击类型
      notificationNum: {type: int, desc: 角标数（可为空）}
      operationCardType:
        enum: {1: 普通运营卡, 2: 活动运营卡}
        desc: 运营卡类型
      cardState:
        enum: {0: 未领取, 1: 已领取}
        desc: 卡片状态
      resName: {db: app, sql: 'SELECT plan_name FROM res_plan WHERE res_id = :resID', desc: 投放计划名（查DB）}
  88860001000001:
    name: 搜索框点击
    fields:
      source:
        enum: {1: 首页, 2: 搜索框, 3: 我的页, 4: 桌面}
        desc: 来源
      page:
        enum: {home: 首页, mine: 我的页, search: 搜索页}
        desc: 页面
      keyword: {not_empty: true, desc: 搜索词}
    asserts:
    - {expr: not (source == '1' and page != 'home'), msg: source=1(首页) 时 page 必须是 home}
  88860005000001:
    name: 历史记录页曝光
    fields:
      allNums: {sql: SELECT count(*) FROM history, db: app, compare: lte, trend: up, desc: 全部历史数}
      novelNums: {sql: SELECT count(*) FROM history WHERE type = 'novel', db: app, compare: lte, desc: 小说数}
      webNums: {sql: SELECT count(*) FROM history WHERE type = 'web', db: app, compare: lte, desc: 网页数}
      videoNums: {sql: SELECT count(*) FROM history WHERE type = 'video', db: app, compare: lte, desc: 视频数}
      source:
        enum: {0: 端内, 1: 桌面小组件}
        ask: true
        desc: 入口
      tab:
        enum: {history: 历史, bookmark: 书签}
        ask: true
        desc: 当前 Tab
    asserts:
    - {expr: int(allNums) == int(novelNums) + int(webNums) + int(videoNums), msg: allNums 应等于 小说 + 网页 + 视频 之和}
cases:
  我的页卡片:
    desc: 进入我的页，看到顶部氛围卡并点击打开
    expect:
    - 88860004086007
    - id: 88860004086008
      values: {type: open, operationCardType: 1}
    - {id: 88860001000001, min: 1}
    - {id: 88860004086009, min: 1}
  历史记录-桌面小组件进入:
    desc: 从桌面小组件进入历史记录页，再切到书签 Tab
    expect:
    - id: 88860005000001
      min: 2
      values:
        source: 1
        tab: [history, bookmark]
  我的页卡片 - 副本:
    desc: 进入我的页，看到顶部氛围卡并点击打开
    expect:
    - '88860004086007'
    - id: '88860004086008'
      values: {type: open, operationCardType: 1}
    - '88860001000001'
    - '88860004086009'
